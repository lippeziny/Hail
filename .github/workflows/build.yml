name: Build APK (Manual)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Build APK
        run: |
          echo "commit=$(echo ${{ github.sha }} | cut -c-7)" >> $GITHUB_ENV
          ./gradlew assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: Hail-${{ inputs.build_type }}-${{ env.commit }}
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          retention-days: 30
